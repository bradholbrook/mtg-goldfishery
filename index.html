<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mull.stat — Commander Mulligan Probability Engine</title>
  <meta name="description" content="Analyze your Commander deck's mulligan probability and opening hand consistency. No login, no ads, runs in your browser." />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Favicon: ruler ticks + card silhouette -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='22' y='8' width='56' height='76' rx='6' fill='%23e2e8f0'/><rect x='22' y='8' width='56' height='76' rx='6' fill='none' stroke='%2364748b' stroke-width='5'/><line x1='22' y1='28' x2='32' y2='28' stroke='%2364748b' stroke-width='4'/><line x1='22' y1='44' x2='36' y2='44' stroke='%2364748b' stroke-width='4'/><line x1='22' y1='60' x2='32' y2='60' stroke='%2364748b' stroke-width='4'/><line x1='22' y1='76' x2='36' y2='76' stroke='%2364748b' stroke-width='4'/></svg>" />
</head>
<body>

<div class="app-shell">

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="app-header">
    <div class="app-logo">
      <svg class="logo-icon" viewBox="0 0 40 52" width="32" height="40" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="2" width="28" height="48" rx="4" fill="currentColor" opacity="0.15"/>
        <rect x="6" y="2" width="28" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
        <line x1="6" y1="14" x2="13" y2="14" stroke="currentColor" stroke-width="2.5"/>
        <line x1="6" y1="24" x2="16" y2="24" stroke="currentColor" stroke-width="2.5"/>
        <line x1="6" y1="34" x2="13" y2="34" stroke="currentColor" stroke-width="2.5"/>
        <line x1="6" y1="44" x2="16" y2="44" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <div>
        mull.stat
        <div class="logo-sub">Commander Mulligan Analysis</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="load-btn" class="btn-secondary" title="Load a previously saved .json file">
        ↑ Load
      </button>
      <input id="load-input" type="file" accept=".json" style="display:none" />
      <button id="save-btn" class="btn-secondary" title="Save all decks and results to a .json file">
        ↓ Save
      </button>
    </div>
  </header>

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="app-sidebar">

    <!-- Import -->
    <div class="sidebar-section">
      <button id="import-toggle" class="import-toggle-btn">+ Import Deck</button>

      <div id="import-panel" class="import-panel hidden">
        <div>
          <div class="input-label">Deck Name</div>
          <input
            id="import-name"
            type="text"
            class="input-text"
            placeholder="My cEDH Deck"
            maxlength="60"
          />
        </div>
        <div>
          <div class="input-label">Moxfield URL or Decklist</div>
          <textarea
            id="import-textarea"
            class="input-text"
            placeholder="Paste a Moxfield deck URL:
https://www.moxfield.com/decks/abc123

Or paste a plain-text export:
Commander
1 Atraxa, Praetors' Voice

Deck
1 Sol Ring
1 Arcane Signet
..."
          ></textarea>
        </div>
        <button id="import-btn" class="btn-primary">Import</button>
      </div>
    </div>

    <!-- Deck list -->
    <div class="sidebar-section sidebar-label">My Decks</div>
    <div id="deck-list"></div>

  </aside>

  <!-- ── Main ────────────────────────────────────────────── -->
  <main class="app-main">
    <div id="active-deck">
      <div class="empty-state" style="margin-top: 80px;">
        <p style="font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text-secondary);">
          Welcome to mull.stat
        </p>
        <p class="muted" style="max-width: 320px; text-align: center; margin-top: 6px;">
          Import a Moxfield Commander decklist from the sidebar to analyze your mulligan probability.
        </p>
      </div>
    </div>
  </main>

</div>

<div id="card-image-preview">
  <img id="card-image-preview-img" src="" alt="" />
  <img id="card-image-preview-img-back" src="" alt="" />
  <div id="card-image-preview-tags"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
